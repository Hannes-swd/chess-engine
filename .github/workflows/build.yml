name: Build & Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -S . -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Kern-Tests
        run: build/Release/chess_tests.exe

      - name: Oberflaechen-Tests
        run: build/Release/chess_ui_tests.exe

      - name: Programm bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ChessEngine-windows
          path: |
            build/Release/chessengine_gui.exe
            build/Release/chessengine_cli.exe
            build/Release/chessengine_uci.exe
            build/Release/bots/
            build/Release/assets/
